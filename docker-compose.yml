
services:
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: amneziawg-web-ui:local
    container_name: amneziawg-web-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # WireGuard/AmneziaWG ports (example; keep/adjust as needed)
      - "43457:43457/udp"
      - "45297:45297/udp"
      - "43724:43724/udp"
      - "47295:47295/udp"
      - "41741:41741/udp"
      - "42504:42504/udp"
      - "43216:43216/udp"
      - "43821:43821/udp"
      - "44637:44637/udp"
      - "44841:44841/udp"
      - "46224:46224/udp"
      - "47129:47129/udp"
      - "48447:48447/udp"
      - "49084:49084/udp"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - /lib/modules:/lib/modules
      # Bind mounts to host so existing data from the legacy single-image
      # deployment (which used `-v /etc/amnezia:/etc/amnezia`) is picked up
      # as-is — clients, server keys, configs all carry over seamlessly.
      - /etc/amnezia:/etc/amnezia
      - /etc/letsencrypt:/etc/letsencrypt
    environment:
      - NGINX_PORT=443
      - NGINX_USER=${NGINX_USER:-admin}
      - NGINX_PASSWORD=${NGINX_PASSWORD:-changeme}
      - SSL_EMAIL=${SSL_EMAIL:-}
      - SSL_DOMAIN=${SSL_DOMAIN:-}
      - AUTO_START_SERVERS=true
      # Internal-only ports for stream-routed REALITY inbounds (port-443 whitelist bypass mode).
      # nginx stream proxies from external :443 to xray:9443+ by SNI — no host-port publishing needed.
      - XRAY_STREAM_BASE_PORT=9443
      # Xray shares the web-ui network namespace so linked VLESS can use AWG policy routing.
      - XRAY_UPSTREAM_HOST=127.0.0.1
      # Own-domain REALITY fallback target. Xray shares web-ui's network namespace,
      # so localhost is the most reliable path to nginx HTTPS on internal :4443.
      - XRAY_REALITY_FALLBACK_TARGET=${XRAY_REALITY_FALLBACK_TARGET:-127.0.0.1:4443}
      # Restrictive-network defaults: prefer IPv4, avoid TCP Fast Open unless
      # the host/network is known to handle it cleanly.
      - XRAY_DNS_QUERY_STRATEGY=${XRAY_DNS_QUERY_STRATEGY:-UseIPv4}
      - XRAY_DOMAIN_STRATEGY=${XRAY_DOMAIN_STRATEGY:-UseIPv4}
      - XRAY_TCP_FAST_OPEN=${XRAY_TCP_FAST_OPEN:-false}
      - XRAY_TCP_MAX_SEG=${XRAY_TCP_MAX_SEG:-0}
      - XRAY_REALITY_MAX_TIME_DIFF_MS=${XRAY_REALITY_MAX_TIME_DIFF_MS:-70000}
      - XRAY_REALITY_SHORT_ID_BYTES=${XRAY_REALITY_SHORT_ID_BYTES:-8}
      - XRAY_WS_EARLY_DATA_BYTES=${XRAY_WS_EARLY_DATA_BYTES:-2560}
      # MemeVPN multi-server subscription branding & cadence.
      - MEMEVPN_BRAND=${MEMEVPN_BRAND:-MemeVPN}
      - MEMEVPN_SUB_UPDATE_HOURS=${MEMEVPN_SUB_UPDATE_HOURS:-24}
      # HAPP subscription app-management. Hide server configs in HAPP by default.
      # Set HAPP_PROVIDER_ID if you have one; HAPP requires it for advanced flags.
      - HAPP_HIDE_SERVER_SETTINGS=${HAPP_HIDE_SERVER_SETTINGS:-true}
      - HAPP_PROVIDER_ID=${HAPP_PROVIDER_ID:-}
      # Keep legacy server-wide VLESS subscriptions admin-only by default.
      # End users should receive per-user /api/sub/user/<token> URLs instead.
      - PUBLIC_SERVER_SUBSCRIPTIONS=${PUBLIC_SERVER_SUBSCRIPTIONS:-false}
      # How long an expired client stays alive before the pruner deletes it
      # (gives users a window to renew without losing their config).
      - CLIENT_DELETE_GRACE_DAYS=${CLIENT_DELETE_GRACE_DAYS:-3}
      # Federation: leave empty on the hub VPS; set to a long random value on
      # satellite VPSes to enable the /api/satellite/* endpoints. Generate one with:
      #   openssl rand -hex 32
      - SATELLITE_API_KEY=${SATELLITE_API_KEY:-}

  xray:
    image: teddysun/xray:26.3.27
    container_name: amneziawg-xray
    restart: unless-stopped
    depends_on:
      - web-ui
    network_mode: "service:web-ui"
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/amnezia:/etc/amnezia
    # Auto-restart xray when config.json changes (simple watchdog).
    # Web UI regenerates /etc/amnezia/xray/config.json after VLESS changes.
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        CFG="/etc/amnezia/xray/config.json"
        echo "[xray] waiting for $$CFG ..."
        while [ ! -f "$$CFG" ]; do sleep 1; done
        last=""
        while true; do
          cur="$$(sha256sum "$$CFG" 2>/dev/null | awk '{print $$1}' || true)"
          if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then
            echo "[xray] config changed, restarting xray"
            last="$$cur"
            # Run xray in background and restart on next change.
            /usr/bin/xray -config "$$CFG" &
            pid="$!"
            # Poll until hash changes, then terminate xray.
            while true; do
              sleep 2
              nxt="$$(sha256sum "$$CFG" 2>/dev/null | awk '{print $$1}' || true)"
              if [ -n "$$nxt" ] && [ "$$nxt" != "$$last" ]; then
                echo "[xray] change detected, stopping pid=$$pid"
                kill "$$pid" 2>/dev/null || true
                wait "$$pid" 2>/dev/null || true
                break
              fi
              # If xray crashed, break and let outer loop restart it.
              if ! kill -0 "$$pid" 2>/dev/null; then
                echo "[xray] process exited, restarting"
                break
              fi
            done
          else
            sleep 2
          fi
        done
    # Xray shares web-ui's network namespace. Do not publish ports here; VLESS is
    # always reached through nginx stream on external TCP :443, while Xray's
    # 9443+ inbounds stay internal.
